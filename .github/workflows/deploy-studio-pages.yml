name: Deploy MindBuild Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/deploy-studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MindBuild repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - name: Install Studio dependencies
        working-directory: studio
        run: pnpm install --frozen-lockfile
      - name: Build GitHub Pages site
        working-directory: studio
        run: pnpm exec vite build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: studio/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
