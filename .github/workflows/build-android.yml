name: MindBuild Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
      artifact_format:
        description: "Release artifact format"
        required: true
        type: choice
        options:
          - apk
          - aab
          - both
        default: both
      export_signing_material:
        description: "Export release keystore + metadata as a protected artifact"
        required: true
        type: boolean
        default: false
      use_ephemeral_signing_key:
        description: "Test-only: generate a temporary release key when repository secrets are not configured"
        required: true
        type: boolean
        default: false
      version_name:
        description: "Optional version name"
        required: false
        type: string
        default: ""
      version_code:
        description: "Optional version code"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mindbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ${{ inputs.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_STORE_FILE: /tmp/mindbuild-release-signing.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_STORE_TYPE: ${{ secrets.RELEASE_STORE_TYPE || 'JKS' }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - name: Checkout submitted project
        uses: actions/checkout@v4

      - name: Validate project shape
        shell: bash
        run: ./scripts/validate-build-engine.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Prepare release signing key
        if: inputs.build_type == 'release'
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_B64" ]]; then
            if [[ "${{ inputs.use_ephemeral_signing_key }}" != "true" ]]; then
              echo "Missing RELEASE_KEYSTORE_B64 repository secret. Release builds are intentionally blocked." >&2
              exit 1
            fi
            echo "Generating an ephemeral test-only release key; it must not be used for production updates."
            export RELEASE_STORE_TYPE=JKS
            export RELEASE_KEY_ALIAS=mindbuild-ephemeral
            export RELEASE_STORE_PASSWORD="MB-ephemeral-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            export RELEASE_KEY_PASSWORD="$RELEASE_STORE_PASSWORD"
            keytool -genkeypair \
              -keystore "$RELEASE_STORE_FILE" \
              -storetype "$RELEASE_STORE_TYPE" \
              -storepass "$RELEASE_STORE_PASSWORD" \
              -keypass "$RELEASE_KEY_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -sigalg SHA256withRSA -validity 10000 \
              -dname "CN=MindBuild Ephemeral Test, OU=CI, O=MindBuild, C=US"
            {
              echo "RELEASE_STORE_TYPE=$RELEASE_STORE_TYPE"
              echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RELEASE_STORE_FILE"
            chmod 600 "$RELEASE_STORE_FILE"
            keytool -list -v -keystore "$RELEASE_STORE_FILE" \
              -storetype "$RELEASE_STORE_TYPE" \
              -storepass "$RELEASE_STORE_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" >/tmp/mindbuild-keytool.txt
            grep -Eq 'Valid from:|Certificate fingerprints:' /tmp/mindbuild-keytool.txt
          fi

      - name: Choose Gradle tasks
        id: tasks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.build_type }}" == "debug" ]]; then
            echo 'tasks=assembleDebug' >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.artifact_format }}" == "apk" ]]; then
            echo 'tasks=assembleRelease' >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.artifact_format }}" == "aab" ]]; then
            echo 'tasks=bundleRelease' >> "$GITHUB_OUTPUT"
          else
            echo 'tasks=assembleRelease bundleRelease' >> "$GITHUB_OUTPUT"
          fi

      - name: Build artifacts
        shell: bash
        run: ./gradlew --no-daemon --stacktrace --console=plain ${{ steps.tasks.outputs.tasks }}

      - name: Collect and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist signing-material
          mkdir -p dist signing-material
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          find app/build/outputs/bundle -type f -name '*.aab' -exec cp {} dist/ \; 2>/dev/null || true
          test -n "$(find dist -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"
          sha256sum dist/* > dist/SHA256SUMS.txt
          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            ./scripts/verify-release.sh dist
          fi

      - name: Export requested release signing material
        if: inputs.build_type == 'release' && inputs.export_signing_material == true
        shell: bash
        run: |
          set -euo pipefail
          signing_extension="${RELEASE_STORE_TYPE,,}"
          signing_output="signing-material/MindBuild-release-signing.${signing_extension}"
          cp "$RELEASE_STORE_FILE" "$signing_output"
          keytool_output="$(keytool -list -v -keystore "$RELEASE_STORE_FILE" \
            -storetype "$RELEASE_STORE_TYPE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS")"
          cert_sha256="$(printf '%s\n' "$keytool_output" | awk -F': ' '/SHA256:/{print $2; exit}')"
          keystore_sha256="$(sha256sum "$signing_output" | awk '{print $1}')"
          cat > signing-material/release-signing-metadata.json <<EOF
          {
            "format": "$RELEASE_STORE_TYPE",
            "alias": "$RELEASE_KEY_ALIAS",
            "keystore_sha256": "$keystore_sha256",
            "certificate_sha256": "$cert_sha256",
            "passwords_included": false
          }
          EOF
          chmod 600 "$signing_output" signing-material/release-signing-metadata.json

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mindbuild-${{ inputs.build_type }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload release signing material only when explicitly requested
        if: inputs.build_type == 'release' && inputs.export_signing_material == true
        uses: actions/upload-artifact@v4
        with:
          name: mindbuild-signing-material-${{ github.run_number }}
          path: signing-material/
          if-no-files-found: error
          retention-days: 3
